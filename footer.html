<script>
	// Static quotes oracle (no PHP). Loads assets/js/quotes-oracle.js with root-aware path
	// so it works on custom domain and on github.io/SiteRangel/.
	(function () {
		var s = document.createElement('script');
		var root = '';
		if (/\/SiteRangel/i.test(location.pathname)) root = '/SiteRangel';
		s.src = root + '/assets/js/quotes-oracle.js';
		s.onload = function () {
			var stored = localStorage.getItem('currentLanguage') || 'pt-BR';
			window.updateQuotesBlock(stored.indexOf('en') === 0 ? 'en' : 'pt');
		};
		document.body.appendChild(s);
	})();
</script>
