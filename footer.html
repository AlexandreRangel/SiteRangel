<script>
	// Available globally; also runs once when footer.html is injected (main2.js may run earlier).
	window.updateQuotesBlock = function(lang) {
		var language = (lang || document.documentElement.lang || navigator.language || "pt").toLowerCase();
		if (language.indexOf("en") === 0) {
			language = "en";
		} else {
			language = "pt";
		}
		var host = location.hostname;
		var useLocalQuotes = host === "www.alexandrerangel.art.br" || host === "alexandrerangel.art.br";
		var quotesUrl = (useLocalQuotes ? "quotes.php" : "https://www.alexandrerangel.art.br/quotes.php") + "?lang=" + language;
		var block = document.getElementById("quotes-block");
		if (block) {
			block.innerHTML =
				'<iframe src="' + quotesUrl + '" width="100%" height="120" sandbox="allow-same-origin allow-scripts allow-forms" scrolling="no" style="overflow:hidden;border:0;display:block" frameborder="0"></iframe>';
		}
	};
	(function () {
		var stored = localStorage.getItem("currentLanguage") || "pt-BR";
		window.updateQuotesBlock(stored.indexOf("en") === 0 ? "en" : "pt");
	})();
</script>
