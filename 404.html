<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Alexandre Rangel</title>
<meta name="description" content="Esta página não existe ou mudou de endereço. Veja o catálogo de obras de Alexandre Rangel.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  :root { --pg-bg:#0a0a0a; --pg-fg:#ddd; --pg-muted:#9aa1a8; --pg-card:#0f1114; --pg-border:#2a2a2a; --pg-accent:#7cf2b0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    line-height: 1.55;
    background: #0a0a0a;
    background-image: radial-gradient(1200px 700px at 50% -10%, #1d2126 0%, #0a0a0a 70%);
    background-attachment: fixed;
    color: var(--pg-fg);
    padding: 1.5rem;
  }
  .nf { max-width: 34rem; width: 100%; background: var(--pg-card); border: 1px solid var(--pg-border); border-radius: 12px; padding: 2rem 1.6rem; }
  .nf h1 { margin: 0 0 .5rem; font-size: 1.6rem; color: var(--pg-accent); }
  .nf p { margin: 0 0 1rem; color: var(--pg-muted); }
  .nf ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem .9rem; }
  .nf a { color: var(--pg-accent); text-decoration: none; border-bottom: 1px solid transparent; }
  .nf a:hover, .nf a:focus { border-bottom-color: currentColor; }
  .nf a:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: 3px; }
  .nf .en { display: none; }
  html[lang="en"] .nf .pt { display: none; }
  html[lang="en"] .nf .en { display: block; }
</style>
</head>
<body>
<main class="nf">
  <h1>404</h1>
  <p class="pt">Esta página não existe ou mudou de endereço.</p>
  <p class="en">This page does not exist or has moved.</p>
  <ul>
    <li><a href="index.html">Início / Home</a></li>
    <li><a href="content.html">Catálogo / Catalogue</a></li>
    <li><a href="bio.html">Quem / Who</a></li>
    <li><a href="tech.html">Tecnologias</a></li>
  </ul>
</main>
<script>
  (function () {
    var en = /[?&]lang=en(&|$)/.test(location.search) ||
             (function () { try { return localStorage.getItem('currentLanguage') === 'en'; } catch (e) { return false; } })();
    if (en) { document.documentElement.lang = 'en'; }
  })();
</script>
</body>
</html>
